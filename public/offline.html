<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>Ameilia AI — Offline</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #ffffff;
      color: #111827;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      text-align: center;
    }
    .container {
      max-width: 420px;
      width: 100%;
      background: #ffffff;
      border: 1px solid #fce7f3;
      border-radius: 2rem;
      padding: 2rem 1.5rem;
      box-shadow: 0 10px 25px -5px rgba(244, 63, 122, 0.1);
    }
    .icon-wrapper {
      width: 72px;
      height: 72px;
      border-radius: 1.5rem;
      background: linear-gradient(135deg, #fce7f3 0%, #fee2e2 100%);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 1.25rem;
      color: #f43f7a;
      box-shadow: 0 4px 12px rgba(244, 63, 122, 0.15);
    }
    h1 {
      font-size: 1.35rem;
      font-weight: 800;
      color: #111827;
      margin-bottom: 0.5rem;
      letter-spacing: -0.02em;
    }
    p {
      font-size: 0.875rem;
      line-height: 1.5;
      color: #4b5563;
      margin-bottom: 1.5rem;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.375rem;
      padding: 0.25rem 0.75rem;
      background: #fdf2f8;
      border: 1px solid #fbcfe8;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 600;
      color: #db2777;
      margin-bottom: 1rem;
    }
    .pulse-dot {
      width: 8px;
      height: 8px;
      border-radius: 9999px;
      background: #f43f7a;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      width: 100%;
      padding: 0.875rem 1.25rem;
      background: linear-gradient(to right, #f43f7a, #fb7185);
      color: #ffffff;
      font-size: 0.875rem;
      font-weight: 700;
      border: none;
      border-radius: 1rem;
      cursor: pointer;
      text-decoration: none;
      box-shadow: 0 4px 14px rgba(244, 63, 122, 0.3);
      transition: transform 0.15s ease, opacity 0.15s ease;
    }
    .btn:active {
      transform: scale(0.98);
    }
    .card-footer {
      margin-top: 1.25rem;
      font-size: 0.75rem;
      color: #9ca3af;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon-wrapper">
      <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M1 1l22 22"></path>
        <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
        <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
        <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
        <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
        <line x1="12" y1="20" x2="12.01" y2="20"></line>
      </svg>
    </div>

    <div class="badge">
      <span class="pulse-dot"></span>
      <span>Offline Mode</span>
    </div>

    <h1>You're Currently Offline</h1>
    <p>
      Don't worry! Your past conversations, relationship memories, and reminders are saved. Ameilia AI will automatically reconnect as soon as your internet is back.
    </p>

    <button class="btn" onclick="window.location.reload()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"></path>
      </svg>
      <span>Try Reconnecting</span>
    </button>

    <div class="card-footer">
      Ameilia AI — Long-Distance Relationship Companion
    </div>
  </div>
</body>
</html>
